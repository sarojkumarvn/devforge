spring.datasource.url=${DB_URL:jdbc:h2:file:./data/devforge-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.devtools.restart.enabled=${DEVTOOLS_RESTART_ENABLED:true}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:when_authorized}
