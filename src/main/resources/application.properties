spring.application.name=devforge
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:.env[.properties],optional:file:devforge/.env[.properties]

server.port=8080
server.servlet.context-path=/api/v1

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devforge}
spring.datasource.username=${DB_USERNAME:${DB_USER:devforge}}
spring.datasource.password=${DB_PASSWORD:devforge}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.locations=classpath:db/migration

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=DevForgePool

spring.devtools.restart.enabled=${DEVTOOLS_RESTART_ENABLED:false}

jwt.secretKey=${JWT_SECRET:devforge-local-development-secret-key-minimum-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.cache.type=${CACHE_TYPE:simple}
spring.cache.cache-names=projects,projectPages,userProfiles,userPages,communities,communityPages,communityMembers,communityPosts,projectComments,feedPages,likedProjects,bookmarkedProjects
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.redis.time-to-live=${CACHE_TTL_MS:600000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

management.endpoints.web.exposure.include=${ACTUATOR_EXPOSED_ENDPOINTS:health,info}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}
management.info.env.enabled=true

springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

logging.pattern.console={"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}","level":"%p","thread":"%t","logger":"%c{36}","message":"%replace(%m){'\"','\\\"'}"}%n
logging.level.com.example.devforge=${APP_LOG_LEVEL:INFO}
